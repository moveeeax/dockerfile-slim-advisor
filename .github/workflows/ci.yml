name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needed:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test -race -cover ./...

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - run: go build -o dockerfile-slim-advisor ./cmd/dockerfile-slim-advisor

      - name: clean example passes
        run: ./dockerfile-slim-advisor examples/good.Dockerfile

      - name: bad example exits 1
        run: |
          # The non-zero exit is the expected result here, so disable -e first.
          set +e
          ./dockerfile-slim-advisor examples/bad.Dockerfile
          code=$?
          set -e
          test "$code" -eq 1

      - name: json output is valid
        run: ./dockerfile-slim-advisor --format json --fail-on never examples/bad.Dockerfile | jq -e '.summary.total > 0'

      - name: reads a Dockerfile from stdin
        run: cat examples/good.Dockerfile | ./dockerfile-slim-advisor -

      - name: sarif output is valid
        run: ./dockerfile-slim-advisor --format sarif --fail-on never examples/bad.Dockerfile | jq -e '.version == "2.1.0" and (.runs[0].results | length) > 0'

      - name: hardened profile blocks the unpinned example
        run: |
          set +e
          ./dockerfile-slim-advisor --profile hardened examples/good.Dockerfile
          code=$?
          set -e
          test "$code" -eq 1
